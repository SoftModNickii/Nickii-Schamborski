    <script>
    // Raster, Filter, Suche und Detailansicht. Die Daten kommen aus
    // data/content.json, die Vorschaubilder aus assets/thumbs/ (erzeugt
    // von tools/website.py build).

    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FILTERS = ['all', 'works', 'shows', 'practice', 'education', 'fellowships', 'press'];
    // Medium wird aus dem Feld "type" abgeleitet, nicht zugeschrieben.
    const MEDIA = [
        ['video', 'Video', t => /video|film/i.test(t)],
        ['installation', 'Installation & Objects', t => /installation|object|sculpture/i.test(t)],
        ['performance', 'Performance', t => /performance/i.test(t)],
        ['photography', 'Photography', t => /photo/i.test(t)],
    ];

    let allContent = [];
    let thumbs = {};
    let currentFilter = 'all';
    let currentMedium = '';
    let currentQuery = '';
    let lastFocus = null;
    let renderToken = 0;

    const grid = document.getElementById('grid-container');
    const statusEl = document.getElementById('grid-status');
    const modal = document.getElementById('detail-modal');
    const dialog = modal.querySelector('.detail-content');
    const body = document.getElementById('detail-body');

    // "2019-11-29", "2020-01-12" -> "29 Nov 2019 – 12 Jan 2020"
    function dateRange(start, end) {
        const fmt = d => {
            const [y, m, day] = d.split('-').map(Number);
            const mon = m ? ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1] : '';
            return [day || '', mon, y].filter(Boolean).join(' ');
        };
        return !end || end === start ? fmt(start) : `${fmt(start)} – ${fmt(end)}`;
    }

    function esc(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function isLocal(path) {
        return path && !/^https?:/.test(path);
    }

    // Pfade in content.json sind teils schon kodiert (%20), teils nicht.
    function assetUrl(path) {
        if (!isLocal(path)) return path;
        let decoded = path;
        try { decoded = decodeURI(path); } catch (e) { /* bleibt roh */ }
        return '../' + encodeURI(decoded);
    }

    function cats(item) {
        return item.categories || [];
    }

    function firstYear(item) {
        return String(item.year || '').replace('/', '–');
    }

    // Neueste zuerst. Erst nach Jahr, innerhalb eines Jahres nach
    // sort_date (JJJJ-MM). Ohne sort_date zaehlt ein Eintrag als Anfang
    // des Jahres und rutscht hinter alle mit bekanntem Monat.
    function sortKey(item) {
        const year = parseInt(String(item.year).split(/[\/-]/)[0], 10) || 0;
        const date = item.sort_date || (year + '-00');
        return { year, date };
    }
    function newestFirst(a, b) {
        const ka = sortKey(a), kb = sortKey(b);
        if (kb.year !== ka.year) return kb.year - ka.year;
        return kb.date.localeCompare(ka.date);
    }

    function mediumOf(item) {
        return MEDIA.filter(([, , test]) => test(item.type || '')).map(([key]) => key);
    }

    // ---------------------------------------------------------- Laden

    Promise.all([
        fetch('../data/content.json?v=' + Date.now()).then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        }),
        fetch('../assets/thumbs/manifest.json?v=' + Date.now())
            .then(r => (r.ok ? r.json() : {}))
            .catch(() => ({})),
    ]).then(([content, manifest]) => {
        allContent = content;
        thumbs = manifest;
        readUrl();
        render(false);
        const itemId = new URLSearchParams(location.search).get('item');
        if (itemId) {
            const item = allContent.find(i => i.id === itemId);
            if (item) showDetailModal(item, null);
        }
    }).catch(error => {
        console.error('Error loading content:', error);
        grid.innerHTML = '<p class="grid-empty">The archive could not be loaded. Please try again later.</p>';
    });

    function readUrl() {
        const params = new URLSearchParams(location.search);
        const f = params.get('filter');
        currentFilter = FILTERS.includes(f) ? f : 'all';
        const m = params.get('medium');
        currentMedium = currentFilter === 'works' && MEDIA.some(([k]) => k === m) ? m : '';
        updateNav();
    }

    function writeUrl(push) {
        const params = new URLSearchParams();
        params.set('filter', currentFilter);
        if (currentMedium) params.set('medium', currentMedium);
        const url = location.pathname + '?' + params.toString();
        if (push) history.pushState({}, '', url);
        else history.replaceState({}, '', url);
    }

    window.addEventListener('popstate', () => {
        closeDetailModal(false);
        readUrl();
        render(false);
        const itemId = new URLSearchParams(location.search).get('item');
        const item = itemId && allContent.find(i => i.id === itemId);
        if (item) showDetailModal(item, null);
    });

    // ---------------------------------------------------------- Navigation

    function updateNav() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.dataset.filter === currentFilter) btn.setAttribute('aria-current', 'page');
            else btn.removeAttribute('aria-current');
            btn.classList.toggle('active', btn.dataset.filter === currentFilter);
        });
        const mediumNav = document.getElementById('medium-nav');
        if (currentFilter !== 'works') {
            mediumNav.hidden = true;
            return;
        }
        mediumNav.hidden = false;
        const works = allContent.filter(i => cats(i).includes('works'));
        const buttons = [['', 'All media']].concat(
            MEDIA.filter(([key]) => works.some(w => mediumOf(w).includes(key)))
                 .map(([key, label]) => [key, label]));
        mediumNav.innerHTML = buttons.map(([key, label]) =>
            `<button type="button" class="medium-btn" data-medium="${key}" aria-pressed="${key === currentMedium}">${esc(label)}</button>`
        ).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', e => {
            e.preventDefault();
            currentFilter = btn.dataset.filter;
            currentMedium = '';
            updateNav();
            writeUrl(true);
            render(true);
        });
    });

    document.getElementById('medium-nav').addEventListener('click', e => {
        const btn = e.target.closest('.medium-btn');
        if (!btn) return;
        currentMedium = btn.dataset.medium;
        updateNav();
        writeUrl(true);
        render(true);
    });

    // ---------------------------------------------------------- Raster

    function visibleItems() {
        let items = currentFilter === 'all'
            ? allContent.slice()
            : allContent.filter(i => cats(i).includes(currentFilter));
        if (currentMedium) items = items.filter(i => mediumOf(i).includes(currentMedium));
        if (currentQuery) {
            items = items.filter(item => [
                item.title, item.type, item.year, item.specs, item.institution,
                item.description, (item.tags || []).join(' ')
            ].filter(Boolean).join(' ').toLowerCase().includes(currentQuery));
        }
        return items.sort(newestFirst);
    }

    function render(animate) {
        const token = ++renderToken;
        const items = visibleItems();
        const old = Array.from(grid.children);
        const fade = animate && !REDUCED_MOTION && old.length;
        old.forEach(card => { card.style.opacity = '0'; });
        setTimeout(() => {
            if (token !== renderToken) return;
            grid.innerHTML = '';
            if (!items.length) {
                grid.innerHTML = '<p class="grid-empty">No results found</p>';
            }
            items.forEach((item, index) => {
                const card = createCard(item);
                if (!REDUCED_MOTION) {
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.96)';
                }
                grid.appendChild(card);
                if (!REDUCED_MOTION) {
                    // Nur die ersten Kacheln gestaffelt, sonst wartet man
                    // bei 90 Eintraegen mehrere Sekunden auf die letzten.
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'scale(1)';
                    }, Math.min(index, 12) * 45);
                }
            });
            const label = currentQuery ? ` matching “${currentQuery}”` : '';
            statusEl.textContent = `${items.length} ${items.length === 1 ? 'entry' : 'entries'}${label}`;
        }, fade ? 250 : 0);
    }

    function coverFor(item) {
        if (!isLocal(item.image)) return null;
        return thumbs[item.id] ? '../assets/thumbs/' + item.id + '.jpg' : assetUrl(item.image);
    }

    function createCard(item) {
        const card = document.createElement('article');
        card.className = 'grid-card';
        card.dataset.itemId = item.id;
        const isPress = cats(item).includes('press');
        const isWrittenBy = isPress && item.press_group === 'written_by';
        const cover = coverFor(item);
        const year = firstYear(item);
        const openLabel = `<span class="visually-hidden">, open details</span>`;
        const cite = isPress && item.csl
            ? `<button type="button" class="cite-btn" data-id="${esc(item.id)}">Cite this →</button>` : '';

        if (!cover) {
            // Eintrag ohne eigenes Bild: typografische Karte statt grauer Flaeche.
            card.classList.add('link-preview-card');
            if (isWrittenBy) card.classList.add('is-written-by');
            let source = item.institution || '';
            let favicon = '';
            if (item.link && /^https?:/.test(item.link)) {
                let domain = '';
                try { domain = new URL(item.link).hostname; } catch (e) { /* ohne */ }
                source = source || domain;
                if (domain && isPress) {
                    favicon = `<img src="https://www.google.com/s2/favicons?domain=${esc(domain)}&sz=32" class="link-preview-favicon" alt="" onerror="this.style.display='none'">`;
                }
            }
            card.innerHTML = `
                <div class="link-preview-content">
                    <div class="link-preview-header">
                        ${favicon}
                        <span class="link-preview-domain">${esc(source)}</span>
                        <span class="link-preview-year">${esc(year)}</span>
                    </div>
                    <div class="link-preview-body">
                        ${item.type ? `<div class="link-preview-kicker">${esc(item.type)}</div>` : ''}
                        <h2 class="link-preview-title"><button type="button" class="card-open" aria-haspopup="dialog">${esc(item.title)}${openLabel}</button></h2>
                        ${item.specs ? `<div class="link-preview-specs">${esc(item.specs)}</div>` : ''}
                    </div>
                    <div class="link-preview-footer">
                        ${isWrittenBy ? '<span class="link-preview-byline">Written by Nickii Schamborski</span>' : ''}
                        <div class="link-preview-actions">
                            <span class="detail-hint" aria-hidden="true">Full details →</span>
                            ${cite}
                        </div>
                    </div>
                </div>`;
            return card;
        }

        card.innerHTML = `
            <img class="card-img" src="${esc(cover)}" alt="" loading="lazy" decoding="async">
            ${isWrittenBy ? '<span class="press-sticker">Written by Nickii Schamborski</span>' : ''}
            <div class="card-inner">
                <div class="card-front">
                    <h2 class="card-title"><button type="button" class="card-open" aria-haspopup="dialog">${esc(item.title)}<span class="card-front-year">${esc(year)}</span>${openLabel}</button></h2>
                </div>
                <div class="card-back" aria-hidden="true">
                    <p class="card-year">${esc(year)}</p>
                    ${item.type ? `<p class="card-type">${esc(item.type)}</p>` : ''}
                    ${item.specs ? `<p class="card-specs">${esc(item.specs)}</p>` : ''}
                    ${item.institution ? `<p class="card-institution">${esc(item.institution)}</p>` : ''}
                    <span class="detail-hint">Full details →</span>
                </div>
                ${cite ? `<div class="card-cite">${cite}</div>` : ''}
            </div>`;
        return card;
    }

    // Klick oder Tippen irgendwo auf die Kachel oeffnet die Detailansicht.
    // Schaltflaechen mit eigener Aufgabe (Zitieren) und Links behalten sie.
    grid.addEventListener('click', e => {
        const cite = e.target.closest('.cite-btn');
        if (cite) {
            const item = allContent.find(i => i.id === cite.dataset.id);
            if (item && item.csl) downloadCSL(item);
            return;
        }
        if (e.target.closest('a')) return;
        const card = e.target.closest('.grid-card');
        if (!card) return;
        const item = allContent.find(i => i.id === card.dataset.itemId);
        if (item) showDetailModal(item, card.querySelector('.card-open'));
    });

    // ---------------------------------------------------------- Detailansicht

    function showDetailModal(item, opener) {
        lastFocus = opener || document.activeElement;
        const isPress = cats(item).includes('press');
        const title = esc(item.title);
        let html = `<h2 id="detail-title">${title}</h2>`;
        html += `<p class="detail-year">${esc(firstYear(item))}</p>`;
        if (item.type) html += `<p class="detail-type">${esc(item.type)}</p>`;

        const imageList = [];
        [item.image].concat(item.images || []).forEach(p => {
            if (isLocal(p) && !imageList.includes(p)) imageList.push(p);
        });
        if (imageList.length) {
            const n = imageList.length;
            html += `<div class="detail-gallery" data-count="${n}">`;
            html += `<div class="gallery-main">`;
            imageList.forEach((img, idx) => {
                const alt = (item.image_alts || {})[img] || `${item.title} (${firstYear(item)})${item.type ? ', ' + item.type : ''}, image ${idx + 1} of ${n}`;
                html += `<img src="${esc(assetUrl(img))}" alt="${esc(alt)}" class="gallery-image${idx === 0 ? ' active' : ''}" data-index="${idx}"${idx === 0 ? '' : ' hidden loading="lazy"'}>`;
            });
            html += `</div>`;
            html += `<p class="gallery-caption" aria-live="polite"><span class="gallery-counter">Image 1 of ${n}</span>${item.image_credit ? ` · <span class="image-credit">${esc(item.image_credit)}</span>` : ''}</p>`;
            if (n > 1) {
                html += `<div class="gallery-nav">`;
                html += `<button type="button" class="gallery-prev" aria-label="Previous image">←</button>`;
                html += `<button type="button" class="gallery-next" aria-label="Next image">→</button>`;
                html += `</div>`;
                html += `<div class="gallery-thumbnails">`;
                imageList.forEach((img, idx) => {
                    html += `<button type="button" class="gallery-thumb${idx === 0 ? ' active' : ''}" data-index="${idx}" aria-label="Show image ${idx + 1} of ${n}"${idx === 0 ? ' aria-current="true"' : ''}><img src="${esc(assetUrl(img))}" alt="" loading="lazy"></button>`;
                });
                html += `</div>`;
            }
            html += `</div>`;
        }

        if (isPress && !isLocal(item.image) && item.link) {
            html += `<div class="external-press-link">`;
            html += `<p><strong>Read the full article:</strong></p>`;
            html += `<a href="${esc(item.link)}" target="_blank" rel="noopener" class="external-link-btn">`;
            html += `<span>View on ${esc(item.institution || 'external site')}</span>`;
            html += `<span class="external-icon" aria-hidden="true">↗</span></a>`;
            html += `</div>`;
        }

        const paragraphs = text => String(text).split(/\n\s*\n/)
            .map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
        if (item.description || item.description_de) {
            html += `<div class="detail-description">`;
            if (item.description_de && cats(item).includes('works')) {
                if (item.description) {
                    html += `<div class="lang-section" lang="en"><h3 class="lang-label">English</h3>${paragraphs(item.description)}</div>`;
                }
                html += `<div class="lang-section" lang="de"><h3 class="lang-label">Deutsch</h3>${paragraphs(item.description_de)}</div>`;
            } else if (item.description) {
                html += paragraphs(item.description);
            }
            html += `</div>`;
        }

        if (item.specs) html += `<p class="detail-specs"><strong>Specs:</strong> ${esc(item.specs)}</p>`;
        if (item.institution) html += `<p class="detail-institution"><strong>Institution:</strong> ${esc(item.institution)}</p>`;
        if (item.date_start) html += `<p class="detail-dates"><strong>Dates:</strong> ${esc(dateRange(item.date_start, item.date_end))}</p>`;

        if (item.collaborators && item.collaborators.length) {
            html += `<div class="detail-collaborators"><h3>Collaborators</h3><ul>`;
            item.collaborators.forEach(c => {
                html += `<li>${esc(c.name)}${c.role ? ` (${esc(c.role)})` : ''}</li>`;
            });
            html += `</ul></div>`;
        }

        const credits = Object.entries(item.credits || {}).filter(([, v]) => v);
        if (credits.length) {
            html += `<div class="detail-credits"><h3>Credits</h3><ul>`;
            credits.forEach(([role, name]) => {
                html += `<li><em>${esc(role.replace(/_/g, ' '))}:</em> ${esc(name)}</li>`;
            });
            html += `</ul></div>`;
        }

        const related = (ids, heading, cls) => {
            const found = (ids || []).map(id => allContent.find(i => i.id === id)).filter(Boolean);
            if (!found.length) return '';
            return `<div class="${cls}"><h3>${heading}</h3><ul>` + found.map(o =>
                `<li><a href="?item=${encodeURIComponent(o.id)}" class="related-link" data-id="${esc(o.id)}">${esc(o.title)}</a> (${esc(firstYear(o))})</li>`
            ).join('') + `</ul></div>`;
        };
        const shownAt = (item.exhibited_at || []).slice();
        allContent.forEach(o => {
            if ((o.exhibited_works || []).includes(item.id) && !shownAt.includes(o.id)) shownAt.push(o.id);
        });
        html += related(shownAt, 'Exhibited at', 'detail-exhibitions');
        html += related(item.exhibited_works, 'Exhibited works', 'detail-works');

        if (item.tags && item.tags.length) {
            html += `<ul class="detail-tags" aria-label="Tags">` +
                item.tags.map(t => `<li class="tag">${esc(t)}</li>`).join('') + `</ul>`;
        }

        const links = [];
        if (cats(item).includes('works')) {
            links.push(`<a href="../works/${encodeURIComponent(item.id)}.html" class="detail-link">Work page →</a>`);
        }
        if (item.link && /^https?:/.test(item.link) && item.link !== item.video_link) {
            links.push(`<a href="${esc(item.link)}" target="_blank" rel="noopener" class="detail-link">Visit link ↗</a>`);
        }
        if (links.length) html += `<div class="detail-links">${links.join('')}</div>`;

        if (item.video_link) {
            html += `<div class="video-link-container"><a href="${esc(item.video_link)}" target="_blank" rel="noopener" class="video-link">${esc(item.video_link)}</a></div>`;
        }

        if (item.pdfs && item.pdfs.length) {
            html += `<div class="detail-pdfs"><h3>PDFs / Catalog Pages</h3><ul>`;
            item.pdfs.forEach(path => {
                const filename = decodeURIComponent(path.split('/').pop());
                html += `<li><a href="${esc(assetUrl(path))}" target="_blank" rel="noopener" class="detail-pdf-link"><span aria-hidden="true">📄</span> ${esc(filename)}</a></li>`;
            });
            html += `</ul></div>`;
        }

        if (isPress && item.csl) {
            html += `<button type="button" class="cite-btn" data-id="${esc(item.id)}">Cite this →</button>`;
        }

        body.innerHTML = html;
        body.scrollTop = 0;
        dialog.scrollTop = 0;
        modal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        dialog.focus();

        const params = new URLSearchParams(location.search);
        if (params.get('item') !== item.id) {
            params.set('item', item.id);
            history.replaceState({}, '', location.pathname + '?' + params.toString());
        }
        document.title = `${item.title} - Nickii Schamborski`;
    }

    function closeDetailModal(restoreFocus = true) {
        if (modal.style.display !== 'flex') return;
        modal.style.display = 'none';
        document.body.style.overflow = '';
        document.title = 'Archive - Nickii Schamborski';
        const params = new URLSearchParams(location.search);
        if (params.has('item')) {
            params.delete('item');
            history.replaceState({}, '', location.pathname + (params.toString() ? '?' + params : ''));
        }
        if (restoreFocus && lastFocus && document.contains(lastFocus)) lastFocus.focus();
    }

    function showImage(idx) {
        const images = body.querySelectorAll('.gallery-image');
        if (!images.length) return;
        const n = images.length;
        idx = (idx + n) % n;
        images.forEach((img, i) => {
            img.hidden = i !== idx;
            img.classList.toggle('active', i === idx);
        });
        body.querySelectorAll('.gallery-thumb').forEach((thumb, i) => {
            thumb.classList.toggle('active', i === idx);
            if (i === idx) thumb.setAttribute('aria-current', 'true');
            else thumb.removeAttribute('aria-current');
        });
        const counter = body.querySelector('.gallery-counter');
        if (counter) counter.textContent = `Image ${idx + 1} of ${n}`;
    }

    function currentImage() {
        const active = body.querySelector('.gallery-image.active');
        return active ? parseInt(active.dataset.index, 10) : 0;
    }

    modal.addEventListener('click', e => {
        if (e.target === modal || e.target.closest('.detail-close')) {
            closeDetailModal();
            return;
        }
        if (e.target.closest('.gallery-next')) showImage(currentImage() + 1);
        else if (e.target.closest('.gallery-prev')) showImage(currentImage() - 1);
        const thumb = e.target.closest('.gallery-thumb');
        if (thumb) showImage(parseInt(thumb.dataset.index, 10));
        const rel = e.target.closest('.related-link');
        if (rel) {
            e.preventDefault();
            const other = allContent.find(i => i.id === rel.dataset.id);
            if (other) showDetailModal(other, lastFocus);
        }
        const cite = e.target.closest('.cite-btn');
        if (cite) {
            const item = allContent.find(i => i.id === cite.dataset.id);
            if (item && item.csl) downloadCSL(item);
        }
    });

    document.addEventListener('keydown', e => {
        if (modal.style.display !== 'flex') return;
        if (e.key === 'Escape') {
            closeDetailModal();
        } else if (e.key === 'ArrowRight' && !e.target.closest('input')) {
            showImage(currentImage() + 1);
        } else if (e.key === 'ArrowLeft' && !e.target.closest('input')) {
            showImage(currentImage() - 1);
        } else if (e.key === 'Tab') {
            // Fokus im Dialog halten
            const focusables = Array.from(dialog.querySelectorAll(
                'button, a[href], input, [tabindex]:not([tabindex="-1"])'))
                .filter(el => !el.hidden && el.offsetParent !== null);
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];
            if (e.shiftKey && (document.activeElement === first || document.activeElement === dialog)) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault();
                first.focus();
            }
        }
    });

    function downloadCSL(item) {
        const blob = new Blob([JSON.stringify(item.csl, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${item.id}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ---------------------------------------------------------- Suche

    const searchToggle = document.getElementById('search-toggle');
    const searchInput = document.getElementById('search-input');
    const searchTool = document.getElementById('search-tool');

    function setSearchOpen(open) {
        searchTool.classList.toggle('expanded', open);
        searchToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    searchToggle.addEventListener('click', () => {
        const open = !searchTool.classList.contains('expanded');
        setSearchOpen(open);
        if (open) setTimeout(() => searchInput.focus(), REDUCED_MOTION ? 0 : 300);
    });

    let searchTimer = null;
    searchInput.addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            currentQuery = e.target.value.toLowerCase().trim();
            render(true);
        }, 200);
    });

    searchInput.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            setSearchOpen(false);
            searchToggle.focus();
        }
    });

    document.addEventListener('click', e => {
        if (!searchTool.contains(e.target) && !searchInput.value) setSearchOpen(false);
    });
    </script>
</body>
</html>
